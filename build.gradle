plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.11'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Exercise the native ModelPart mesh/UV submission without requiring a GPU/window.
tasks.register('verifyMariMesh', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'kr.kwon.capitalcraft.client.resident.render.MariMeshVerification'
    jvmArgs '-Djava.awt.headless=true'
}

tasks.register('verifySeiaMesh', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'kr.kwon.capitalcraft.client.resident.render.SeiaMeshVerification'
    jvmArgs '-Djava.awt.headless=true'
}

// The verification source is an executable headless harness rather than a JUnit test.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

check.dependsOn verifyMariMesh, verifySeiaMesh

// Opt-in compatibility runs use the exact launcher artifacts, remapped by Loom.
// Sodium/Iris and the test entrypoint are not bundled in the production JAR.
if (providers.gradleProperty('mariCompatibility').isPresent()) {
    repositories { maven { url = 'https://api.modrinth.com/maven' } }
    dependencies {
        modLocalRuntime 'maven.modrinth:sodium:mc1.21.11-0.8.12-fabric'
        if (providers.gradleProperty('mariCompatibility').get() == 'iris') {
            modLocalRuntime 'maven.modrinth:iris:fDpuVzVr'
        }
    }
    loom {
        mods {
            'capitalcraft-mod' { sourceSet sourceSets.main }
            'capitalcraft-render-verification' { sourceSet sourceSets.test }
        }
        runs {
            mariCompatibility {
                client()
                source sourceSets.test
                runDir 'build/mari-compatibility'
                vmArg '-Dcapitalcraft.verifyMariCompatibility=true'
                vmArg "-Dcapitalcraft.verifyIris=${providers.gradleProperty('mariCompatibility').get() == 'iris'}"
                vmArg '-Djava.awt.headless=true'
            }
        }
    }
}
